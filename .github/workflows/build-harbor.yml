name: Build & push to Harbor

# gallis-local fork only: builds the v0.9.0 code on node:24-slim (upstream PR
# argoproj-labs/mcp-for-argocd#163) and pushes to Harbor. GitHub-hosted runners
# cannot reach core.harbor.e.gallis.cloud, so this uses the self-hosted pool.
# Secrets/runner pattern copied from gallis-local/Cellarion build-harbor.yml.

on:
  push:
    branches: [node24-harbor]
  workflow_dispatch:

env:
  REGISTRY: core.harbor.e.gallis.cloud
  IMAGE_NAME: gallis/mcp-for-argocd
  BASE_VERSION: v0.9.0-node24

jobs:
  build:
    runs-on: [self-hosted, x64]
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup HashiCorp Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4
        with:
          url: ${{ vars.VAULT_ADDR }}
          method: jwt
          role: github-actions-role
          path: github-actions
          exportToken: false
          secrets: |
            prod-kubernetes/data/github/harbor/harbor-arm harbor-github-password | HARBOR_PASSWORD ;
            prod-kubernetes/data/github/harbor/harbor-arm harbor-github-username | HARBOR_USERNAME ;

      - name: Login to Harbor Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          driver-opts: network=host

      - name: Compute tags
        id: tags
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_VERSION }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.BASE_VERSION }}-${{ steps.tags.outputs.short }}
          provenance: false
